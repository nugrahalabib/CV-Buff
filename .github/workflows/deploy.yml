# DISABLED — DO NOT RE-ENABLE without changing the DB access layer.
# CV-Buff uses a `pg` (node-postgres) TCP connection pool for auth + per-user CV storage
# (src/lib/server/db.ts). That does NOT work on the Cloudflare Workers edge runtime, so
# deploying here would ship an app where login and CV save fail at runtime.
# Canonical deploy is Node/Docker on a VPS (see docs/DEPLOYMENT.md + docs/AUTH.md).
# Kept for reference only. To use Cloudflare later, route DB through Hyperdrive / an HTTP
# Postgres driver first, then remove the `if: false` guard below.
name: Deploy to Cloudflare (disabled — pg incompatible with Workers edge)

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
